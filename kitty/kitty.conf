font_size 18
# 素の Iosevka はアイコン（Nerd Font PUA）を持たず、kitty は内蔵の Symbols Nerd Font Mono へ
# 自動フォールバックする。だが内蔵フォントは upem 2048・アイコン 1.000em で、Iosevka のセル
# 0.500em に対して2倍幅になり潰れる。symbol_map での委譲は委譲先が同じ内蔵フォントなので幅が
# 直らず、かつ Symbols Nerd Font Mono は U+21E3/21E1（⇣⇡）を持たないため一律委譲は現状
# 描画できているグリフを壊す。パッチ済みフォントなら欧文もアイコンも 0.500em で一致する。
font_family Iosevka Nerd Font Mono
# Iosevka Nerd Font Mono は U+4E00 等の CJK を持たないため、この行を外すと日本語が描画できない。
symbol_map U+3000-U+30FF,U+FF00-U+FFEF,U+4E00-U+9FFF Migu 1M
# 透過を切る。0.85 だと背後のウィンドウが15%そのまま抜け、background_blur 0 のため
# ぼかしも掛からない。Review/Implement は Claude Code の出力を読むペインなので、
# 背後の構造（表の罫線・カード枠）がペイン境界と混ざって可読性を落とす。
# 透過を戻すなら background_opacity 0.9 と background_blur 64 を併記する。
background_opacity 1.0

# 末尾ではなく先頭側で include する。kitty は後勝ちのため末尾に置くと、テーマ側の
# url_color / mark1_* / mark2_background が下方の明示指定を上書きしてしまう。
include current-theme.conf
# Mod を command に mapping 
kitty_mod cmd

# for URL settings
url_color #0087bd
url_style single
open_url_with default
url_prefixes http https file ftp gemini irc gopher mailto news git
detect_urls yes

# Tab
tab_bar_min_tabs 1
tab_bar_style powerline
active_tab_font_style bold
tab_title_template "{fmt.fg.white}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{title}"
active_tab_title_template "{fmt.fg.white}{bell_symbol}{activity_symbol}{'[%s] '%keyboard_mode.upper() if keyboard_mode != '' else ''}{fmt.fg.tab}{index}:{title}"

# Behavior
confirm_os_window_close 1
enable_audio_bell no
bell_on_tab yes

# macOS
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# Marker
mark1_foreground white
mark1_background red
mark2_background yellow

# Shortcuts
clear_all_shortcuts yes

## reload config
map ctrl+cmd+, load_config_file

## window
map cmd+equal change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0 change_font_size all 0

## close
map cmd+q quit

## clipboard
map cmd+v paste_from_clipboard
map cmd+c copy_to_clipboard

## tmux like mode
map --new-mode prefix --on-action end ctrl+b
map --mode prefix esc pop_keyboard_mode

### tab
map --mode prefix c new_tab
map --mode prefix n next_tab
map --mode prefix p previous_tab
map --mode prefix s launch --location=hsplit
map --mode prefix v launch --location=vsplit
map --mode prefix x close_window
map --mode prefix h neighboring_window left
map --mode prefix j neighboring_window down
map --mode prefix k neighboring_window up
map --mode prefix l neighboring_window right
map --mode prefix z toggle_layout stack
map --mode prefix shift+h kitten relative_resize.py left
map --mode prefix shift+j kitten relative_resize.py down
map --mode prefix shift+k kitten relative_resize.py up
map --mode prefix shift+l kitten relative_resize.py right

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten $HOME/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim
map --mode prefix [ kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map --mode prefix ] kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Startup
startup_session startup_session.conf

# SSH環境別設定の読み込み
# include ssh-environments.conf
