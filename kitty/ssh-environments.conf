# 基本設定（デフォルトのCyberpunkテーマ）
include Cyberpunk.conf

# 開発環境設定 (pfdev-* にマッチ)
host pfdev-*
    # 青系の落ち着いた開発環境カラー
    background              #001020
    foreground             #00FFC8
    cursor                 #00FFC8
    cursor_text_color      #000000
    
    # タブバーの色設定
    active_tab_foreground   #000000
    active_tab_background   #00FFC8
    inactive_tab_foreground #00FFC8
    inactive_tab_background #001020
    tab_bar_background      #001530
    
    # ウィンドウボーダー
    active_border_color     #00FFC8
    inactive_border_color   #003366
    
    # URL色
    url_color              #76C1FF
    
    # 背景透過を許可
    background_opacity     0.85
    
    # タブタイトルに環境バッジを追加
    tab_title_template        "{fmt.fg.cyan}[DEV]{fmt.fg.tab} {title}"
    active_tab_title_template "{fmt.fg.cyan}[DEV]{fmt.fg.tab} {title}"

# 本番環境設定 (prod-* にマッチ)
host prod-*,!stg-*,bastion*,yappli-plus-prod*,sogoseibu-prod*
    # 警告的な赤系の配色
    background              #200505
    foreground             #FF3366
    cursor                 #FF0000
    cursor_text_color      #000000
    
    # タブバーを警告的な色に
    active_tab_foreground   #000000
    active_tab_background   #FF3366
    inactive_tab_foreground #FF3366
    inactive_tab_background #200505
    tab_bar_background      #300A0A
    
    # ウィンドウボーダーを目立つ赤に
    active_border_color     #FF0000
    inactive_border_color   #660000
    
    # URL色も警告的に
    url_color              #FF6666
    
    # 背景透過を無効化（誤操作防止）
    background_opacity     1.0
    
    # タブタイトルに警告バッジを追加
    tab_title_template        "{fmt.fg.red}[PROD]{fmt.fg.tab} {title}"
    active_tab_title_template "{fmt.fg.red}[PROD]{fmt.fg.tab} {title}"

# ステージング環境設定 (stg-* にマッチ)
host stg-*
    # 注意喚起的な黄色系の配色
    background              #202010
    foreground             #FFCC00
    cursor                 #FFCC00
    cursor_text_color      #000000
    
    # タブバーも黄色系で統一
    active_tab_foreground   #000000
    active_tab_background   #FFCC00
    inactive_tab_foreground #FFCC00
    inactive_tab_background #202010
    tab_bar_background      #302A15
    
    # ウィンドウボーダーも黄色系
    active_border_color     #FFCC00
    inactive_border_color   #665500
    
    # URL色も環境に合わせて
    url_color              #FFE666
    
    # 背景透過を無効化（誤操作防止）
    background_opacity     1.0
    
    # タブタイトルに環境バッジを追加
    tab_title_template        "{fmt.fg.yellow}[STG]{fmt.fg.tab} {title}"
    active_tab_title_template "{fmt.fg.yellow}[STG]{fmt.fg.tab} {title}"
